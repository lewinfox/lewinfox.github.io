# The URL the site will be built for
base_url = "https://www.lewinfox.com"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# No search UI on the site, so don't build or load a search index
build_search_index = false

taxonomies = [{ name = "tags" }]

[markdown]

# Syntax highlighting for code blocks. The site is dark-only, so one dark theme.
# Themes: https://www.getzola.org/documentation/content/syntax-highlighting/
[markdown.highlighting]
theme = "github-dark"

[extra]
# Site metadata
title = "Lewin Fox"
description = "Apps, websites and data systems for businesses. Based in Queenstown, New Zealand."
author = "Lewin Fox"
location = "Queenstown, New Zealand"

# Contact links, used in the header and footer
email = "lewin.a.f@gmail.com"
github = "https://github.com/lewinfox"
linkedin = "https://www.linkedin.com/in/lewinfox"

menu_items = [
  { name = "Services", url = "/services/" },
  { name = "About", url = "/about/" },
  { name = "Blog", url = "/blog/" },
]

# Background photos. A landing page picks one with `[extra] photo = "lake"` in
# its front matter; the blog uses `reading_photo`; the 404 page uses "lookout".
# Files live in static/img/, and each needs a .photo-<name> class in style.scss.
reading_photo = "autumn"

[extra.photos.autumn]
credit = "Joel Staveley"
url = "https://unsplash.com/photos/aAO4Kw-RD1c"

[extra.photos.lookout]
credit = "Sébastien Goldberg"
url = "https://unsplash.com/photos/k6ngIyjAfd8"

[extra.photos.hero]
credit = "Stephen Gong"
url = "https://unsplash.com/photos/snow-capped-mountains-overlook-a-coastal-town-at-dusk-mgook43bEVw"

[extra.photos.lake]
